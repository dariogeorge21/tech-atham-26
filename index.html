<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Onam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c2416;
            font-family: Georgia, 'Times New Roman', serif;
            overflow-x: auto;
        }

        .scene {
            position: relative;
            width: 720px;
            height: 1020px;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(255, 250, 230, 0.9) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(240, 230, 200, 0.6) 0%, transparent 40%),
                linear-gradient(165deg, #f8f0d8 0%, #f0e4c4 25%, #e8d9b0 50%, #f2e6c8 75%, #faf3e0 100%);
            border: 14px solid #c9a227;
            box-shadow:
                inset 0 0 0 3px #8b6914,
                inset 0 0 0 6px #e8d48b,
                0 20px 60px rgba(0, 0, 0, 0.55);
            overflow: hidden;
        }

        /* ornate corner frames */
        .scene::before,
        .scene::after {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border: 3px solid #b8860b;
            z-index: 20;
            pointer-events: none;
        }

        .scene::before {
            top: 18px;
            left: 18px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 8px;
        }

        .scene::after {
            top: 18px;
            right: 18px;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 8px;
        }

        .corner-bl,
        .corner-br {
            position: absolute;
            width: 90px;
            height: 90px;
            border: 3px solid #b8860b;
            z-index: 20;
            pointer-events: none;
        }

        .corner-bl {
            bottom: 18px;
            left: 18px;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 8px;
        }

        .corner-br {
            bottom: 18px;
            right: 18px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 8px;
        }

        /* parchment texture overlay */
        .texture {
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139, 105, 20, 0.03) 3px, rgba(139, 105, 20, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139, 105, 20, 0.02) 3px, rgba(139, 105, 20, 0.02) 4px);
            pointer-events: none;
            z-index: 1;
        }

        /* ========== FOLIAGE TOP LEFT ========== */
        .foliage-left {
            position: absolute;
            top: -10px;
            left: -20px;
            width: 200px;
            height: 220px;
            z-index: 5;
        }

        .leaf {
            position: absolute;
            width: 55px;
            height: 28px;
            background: linear-gradient(135deg, #3d7a2c 0%, #5a9e3a 40%, #2d5a1e 100%);
            border-radius: 50% 0 50% 50%;
            transform-origin: right center;
        }

        .leaf::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            width: 70%;
            height: 1px;
            background: rgba(20, 50, 10, 0.4);
        }

        .leaf.l1 {
            top: 30px;
            left: 40px;
            transform: rotate(-25deg);
        }

        .leaf.l2 {
            top: 50px;
            left: 70px;

            width: 48px;
        }

        /* ========== HEADER TEXT ========== */
        .header-text {
            position: absolute;
            top: 55px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .wish-line {
            font-size: 13px;
            letter-spacing: 4px;
            color: #5c4033;
            font-weight: 600;
            text-transform: uppercase;
        }

        .happy {
            font-size: 42px;
            font-weight: 700;
            color: #2d6b2d;
            letter-spacing: 8px;
            margin-top: 8px;
            text-shadow: 1px 1px 0 #1a4a1a;
        }

        .onam {
            font-size: 72px;
            font-weight: 800;
            color: #8b5a0a;
            letter-spacing: 6px;
            line-height: 1;
            text-shadow:
                2px 2px 0 #5c3a05,
                0 0 20px rgba(200, 150, 40, 0.3);
            position: relative;
        }

        .onam::before,
        .onam::after {
            content: '❖';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #b8860b;
        }

        .onam::before {
            left: -30px;
        }

        .onam::after {
            right: -30px;
        }

        .ornament {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 6px 0 10px;
        }

        .ornament span {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b8860b, transparent);
        }

        .ornament::before,
        .ornament::after {
            content: '✦';
            color: #b8860b;
            font-size: 10px;
        }

            margin-top: 85px;

            letter-spacing: 3px;

            font-weight: 600;

        /* ========== MAVELI FIGURE ========== */

        /* body torso */

            box-shadow:
                inset -15px 0 25px rgba(0, 0, 0, 0.08),

        .belly {
            position: absolute;
            bottom: 155px;
            left: 70px;
            width: 120px;
            height: 130px;
            background: linear-gradient(180deg, #f8e8d0 0%, #e8c8a0 50%, #d4a878 100%);

        .lamp-flame {

            width: 8.5px;
            height: 17px;

                transform: rotate(1.5deg);
            }
        }

</head>
